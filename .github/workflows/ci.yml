name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check tennis_predictor.py tests
      - run: ruff format --check tennis_predictor.py tests
      - run: mypy --strict tennis_predictor.py tests
      - run: python -m compileall -q tennis_predictor.py tests
      - run: python tennis_predictor.py
