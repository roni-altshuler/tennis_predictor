name: Checks and Pages

on: [push, pull_request]

permissions:
  contents: read

# Keep a main deployment and its live browser verification together.
concurrency:
  group: checks-and-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check tennis_predictor.py tests
      - run: ruff format --check tennis_predictor.py tests
      - run: mypy --strict tennis_predictor.py tests
      - run: python -m compileall -q tennis_predictor.py tests
      - run: python tennis_predictor.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_version: ${{ steps.version.outputs.source_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Record the built source fingerprint
        id: version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { loadConfigFromFile } from 'vite';
          const { config } = await loadConfigFromFile({ command: 'build', mode: 'production' });
          const fingerprint = JSON.parse(config.define.__SOURCE_VERSION__);
          if (!/^[a-f0-9]{64}$/.test(fingerprint)) throw new Error('Invalid source fingerprint');
          appendFileSync(process.env.GITHUB_OUTPUT, `source_version=${fingerprint.slice(0, 12)}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          EXPECTED_SOURCE_VERSION: ${{ steps.version.outputs.source_version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
      - name: Upload the tested static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Initial Pages setup is an owner action, never an elevated workflow token.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-browser:
    needs: [web, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify the actual deployed version and all browser flows
        run: |
          test -n "$PLAYWRIGHT_BASE_URL"
          test -n "$EXPECTED_SOURCE_VERSION"
          npm run test:browser
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SOURCE_VERSION: ${{ needs.web.outputs.source_version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-report
          path: playwright-report/
          retention-days: 7
